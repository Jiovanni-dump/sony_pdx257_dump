#[Label]
#sensor <Index number>
#polling <ms order>
#path <SYSFS path to write the value>
#setting <threhold temp value for mitigation off> <Threshold temperature value for mitigation on> <Mitigation setting value>
#setting <threhold temp value for mitigation off> <Threshold temperature value for mitigation on> <Mitigation setting value>
#
# Note: "setting" parameters must be written in ascending order of on_threshold temperature.


[disconnect CC line in USB]
sensor 80
polling 1000
path /sys/class/battchg_ext/system_temp_level
setting -1100 1250 15

[power-off charge]
sensor 79
polling 1000
path /sys/class/battchg_ext/system_temp_level
setting 340 350 1
setting 360 370 2
setting 370 390 3
setting 390 410 4
setting 410 430 5
setting 430 440 6
setting 445 460 7
setting 460 480 8
setting 480 500 9
setting 500 550 10
